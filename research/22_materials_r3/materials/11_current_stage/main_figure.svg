   <g id="text_1">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="127.242" y="30.4848" transform="rotate(-0 127.242 30.4848)">当前OSM末段规划研究：已具备什么，还缺什么</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="145.377" y="100.3392" transform="rotate(-0 145.377 100.3392)">当前完成｜空间表示与规则</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(145.377 132.417125)">原生步道保留、约束导出、步行面穿行</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(145.377 149.220656)">已知门的条件末段路线与可操作原型</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="479.061" y="100.3392" transform="rotate(-0 479.061 100.3392)">当前证据｜典型场景开发</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(479.061 132.417125)">固定上海地图、开发/回归与负结果</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(479.061 149.220656)">不能据此宣告跨建筑或跨城市泛化</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="145.377" y="205.1208" transform="rotate(-0 145.377 205.1208)">下一阶段｜独立多场景验证</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(145.377 237.198725)">按建筑/共享道路隔离数据分组</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(145.377 254.002256)">核对地图覆盖、端点身份与适用范围</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="479.061" y="205.1208" transform="rotate(-0 479.061 205.1208)">尚未解决｜现实与工程边界</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(479.061 237.198725)">同层、通行权限和现场验证仍缺</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(479.061 254.002256)">冷启动和多候选效率仍有限制</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #555555" x="7.2" y="443.16" transform="rotate(-0 7.2 443.16)">本图为材料归纳，不是新增研究或实验；旧NYC已训练匹配器属另一历史轨道，不能说项目从未训练模型。</text>
  </g>
