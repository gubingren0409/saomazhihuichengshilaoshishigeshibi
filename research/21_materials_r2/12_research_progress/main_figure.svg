   <g id="text_1">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="127.242" y="30.4848" transform="rotate(-0 127.242 30.4848)">阶段推进：把“图上有位置”转成“可解释的末段路线”</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="145.377" y="100.3392" transform="rotate(-0 145.377 100.3392)">① 线网不足 → ② 引入步行面</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(145.377 132.417125)">南门存在，线网却不包含可用入口连接</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(145.377 149.220656)">南广场原生面提供另一类空间表示</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="479.061" y="100.3392" transform="rotate(-0 479.061 100.3392)">③ 保守边缘 → ④ 南门条件接通</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(479.061 132.417125)">R4-REV1生成受约束面内计算边</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(479.061 149.220656)">历史不能改写成“只北侧恢复”消融</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="145.377" y="205.1208" transform="rotate(-0 145.377 205.1208)">⑤ 保留草地步道 → ⑥ 门前条件接入</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(145.377 237.198725)">修正已有步道被背景草地抹掉的问题</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(145.377 254.002256)">北出口假设连接保持exit和未知身份</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="479.061" y="205.1208" transform="rotate(-0 479.061 205.1208)">⑦ 完整面穿行 → ⑧ 分清业务收益</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(479.061 237.198725)">保留洞、障碍和限制后减少绕行</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(479.061 254.002256)">新增面/局部连通不保证完整路线改善</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #555555" x="7.2" y="443.16" transform="rotate(-0 7.2 443.16)">逻辑推进链，非同一实验的连续性能曲线；各阶段起点、目标、约束、分母及版本分别绑定来源。</text>
  </g>
